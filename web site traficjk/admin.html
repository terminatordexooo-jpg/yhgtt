<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Собранные лиды</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --bg2: #12121a;
            --card: #16161f;
            --border: rgba(255, 255, 255, 0.06);
            --text: #f0f0f5;
            --muted: #8a8a9a;
            --cyan: #00f0ff;
            --purple: #7b61ff;
            --green: #00e88f;
            --red: #ff4d4d;
            --gradient: linear-gradient(135deg, #00f0ff, #7b61ff, #ff4da6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 40px 24px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        h1 span {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .btn-danger {
            border-color: rgba(255, 77, 77, 0.2);
        }

        .btn-danger:hover {
            border-color: var(--red);
            color: var(--red);
        }

        .count-badge {
            font-size: 0.85rem;
            color: var(--muted);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--card);
        }

        .count-badge strong {
            color: var(--cyan);
            font-family: 'JetBrains Mono', monospace;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th {
            text-align: left;
            padding: 14px 16px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 14px 16px;
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border);
        }

        tr:hover td {
            background: rgba(0, 240, 255, 0.02);
        }

        .username {
            font-family: 'JetBrains Mono', monospace;
            color: var(--cyan);
            font-weight: 600;
        }

        .timestamp {
            color: var(--muted);
            font-size: 0.82rem;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--muted);
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .empty-state p {
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .empty-state small {
            font-size: 0.8rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-size: 0.85rem;
            text-decoration: none;
            margin-bottom: 24px;
            transition: 0.2s;
        }

        .back-link:hover {
            color: var(--cyan);
        }

        @media (max-width: 640px) {
            body {
                padding: 24px 16px;
            }

            h1 {
                font-size: 1.3rem;
            }

            th,
            td {
                padding: 10px 12px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="index.html" class="back-link">← Назад к сайту</a>
        <div class="header">
            <h1>📋 Собранные <span>лиды</span></h1>
            <div class="actions">
                <button class="btn" id="export-btn" title="Скопировать все лиды">📋 Копировать</button>
                <button class="btn" id="download-btn" title="Скачать CSV">⬇ CSV</button>
                <button class="btn btn-danger" id="clear-btn" title="Удалить все">🗑 Очистить</button>
            </div>
        </div>
        <div class="count-badge">Всего лидов: <strong id="total-count">0</strong></div>
        <div id="leads-container"></div>
    </div>

    <script>
        const container = document.getElementById('leads-container');
        const totalCount = document.getElementById('total-count');

        function getLeads() {
            try {
                return JSON.parse(localStorage.getItem('trafficpro_leads') || '[]');
            } catch { return []; }
        }

        function render() {
            const leads = getLeads();
            totalCount.textContent = leads.length;

            if (leads.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>Лидов пока нет</p>
                        <small>Когда кто-то оставит свой Telegram, он появится здесь</small>
                    </div>`;
                return;
            }

            // Reverse: newest first
            const sorted = [...leads].reverse();
            let html = `<table>
                <thead><tr><th>#</th><th>Telegram</th><th>Дата</th></tr></thead>
                <tbody>`;
            sorted.forEach((lead, idx) => {
                const date = new Date(lead.timestamp);
                const formatted = date.toLocaleString('ru-RU', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
                html += `<tr>
                    <td>${leads.length - idx}</td>
                    <td class="username">${lead.username}</td>
                    <td class="timestamp">${formatted}</td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // Export to clipboard
        document.getElementById('export-btn').addEventListener('click', () => {
            const leads = getLeads();
            const text = leads.map(l => l.username).join('\n');
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('export-btn');
                btn.textContent = '✅ Скопировано!';
                setTimeout(() => btn.textContent = '📋 Копировать', 2000);
            });
        });

        // Download CSV
        document.getElementById('download-btn').addEventListener('click', () => {
            const leads = getLeads();
            let csv = 'Username,Date,UserAgent\n';
            leads.forEach(l => {
                csv += `"${l.username}","${l.timestamp}","${(l.userAgent || '').replace(/"/g, '""')}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `leads_${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // Clear all
        document.getElementById('clear-btn').addEventListener('click', () => {
            if (confirm('Точно удалить все лиды? Это действие нельзя отменить.')) {
                localStorage.removeItem('trafficpro_leads');
                render();
            }
        });

        render();
    </script>
</body>

</html>
